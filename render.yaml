services:
  - type: web
    name: RiteshStudentMsystem
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: RiteshStudentMsystem
      - key: MONGODB_URI
        sync: false
